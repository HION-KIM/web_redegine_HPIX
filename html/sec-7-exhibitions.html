<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPIX 전시</title>
    <!-- Script Jquery's JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <!-- Script Swiper's JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <!-- Script GSAP's JS -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <!-- Script ScrollTrigger's JS -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>


    <!-- Link Inner's CSS -->
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div>
        <main>
            <section class="sec-7-exhibitions">
                <div class="container">
                    <div>
                        <div>Current Exhibition</div>
                        <div>공간과 오브제가 만들어내는 새로운 균형, 에이치픽스 전시에서 만나보세요.</div>
                        <div><a href="#">Veiw More</a></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <style>
        .sec-7-exhibitions>.container {
            width: 100%;
            height: clamp(500px,0.8vh,760px);
            display: flex;
            align-items: center;
            padding: 0 12vw;
            position: relative;
            box-sizing: border-box;
        }

        .sec-7-exhibitions>.container::before {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;

            z-index: -1;

            background-image: url(../imgs/img-sec-7-banner.png);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        .sec-7-exhibitions>.container>div>div:nth-child(1) {
            font-size:clamp(64px, 4.17vw, 80px);
            font-weight: 400;
            color: #fff;
        }

        .sec-7-exhibitions>.container>div>div:nth-child(2) {
            font-size:clamp(16px, 1.46vw, 28px);
            font-weight: 400;
            margin-bottom: 40px;
            color: #fff;
        }

        .sec-7-exhibitions>.container>div>div:nth-child(3) {
            font-size:clamp(14px, 1.04vw, 20px);
            font-weight: 500;
            position: relative;
            color: #fff;
            display: inline-block;
        }

        .sec-7-exhibitions>.container>div>div:nth-child(3)>a::after {
            content: "";
            display: block;
            width: 100%;
            height: 1px;
            background-color: #fff;
            position: absolute;
            left: 0;
            bottom: -4px;
        }

        @media (max-width:1300px) and (min-width:1001px) {
            .sec-7-exhibitions>.container {
                height: 670px;
                padding: 0 40px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(1) {
                font-size: 60px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(2) {
                font-size: 24px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(3) {
                font-size: 16px;
            }
        }

        @media (max-width:1000px) and (min-width:743px) {
            .sec-7-exhibitions>.container {
                height: 670px;
                padding: 0 20px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(1) {
                font-size: 60px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(2) {
                font-size: 24px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(3) {
                font-size: 16px;
            }
        }

        @media (max-width:742px) {
            .sec-7-exhibitions>.container {
                height: 396px;
                padding: 0 20px;
                min-width: 390px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(1) {
                font-size: 28px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(2) {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .sec-7-exhibitions>.container>div>div:nth-child(3) {
                font-size: 12px;
            }
        }
    </style>

</body>

</html>
