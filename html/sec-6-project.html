    <style>
        .sec-6-project>.container {
            width: 100%;
            height: 100vh;
        }

        .sec-6-project .sec-6-swiper {
            width: 100%;
            height: 100%;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper {
            width: 100%;
            height: 100%;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide {
            width: 100%;
            height: 100%;

            display: flex;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content {
            padding-top: 47vh;
            padding-left: 4.17vw;
            position: relative;
            width: 50%;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content::after {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            z-index: -2;

            background-image: url(../imgs/img-sec-6-slide-1.jpg);
            background-repeat: no-repeat;
            background-position: 40% center;
            background-size: auto 120%;

        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(2)>.content::after {
            background-image: url(../imgs/img-sec-6-slide-2.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(3)>.content::after {
            background-image: url(../imgs/img-sec-6-slide-3.jpg);
            background-position: 20% center;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content::before {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            z-index: -1;
            background-color: #000;
            opacity: 0.3;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content>h1 {
            font-size: clamp(20px, 2.5vw, 48px);
            font-weight: 400;
            color: #fff;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content>.name {
            display: block;
            font-size: clamp(18px, 1.46vw, 28px);
            font-weight: 400;
            color: #fff;
            margin: 44px 0 12px;

        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content>.text {
            font-size: clamp(14px, 1.25vw, 24px);
            font-weight: 500;
            color: #fff;

            margin-bottom: 20px;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content>.btn {
            font-size: clamp(12px, 1.04vw, 20px);
            font-weight: 500;
            position: relative;
            color: #fff;
            display: inline-block;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content>.btn>a::after {
            content: "";
            display: block;
            width: 100%;
            height: 1px;
            background-color: #fff;

            position: absolute;
            left: 0;
            bottom: 0px;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content>.pagination {
            font-size: 16px;
            font-weight: 500;
            color: #CCCCCC;
            display: flex;
            gap: 14px;
            align-items: center;

            margin-top: 20px;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content>.pagination>div:not(:nth-child(2)) {
            height: 13px;
            cursor: pointer;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.content>.pagination>div>span {
            color: #fff;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;

            padding: 40px 20px;

            box-sizing: border-box;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.background {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.background>div.bg {
            width: 100%;
            height: 100%;
            inset: 0;
            background-image: url(../imgs/img-sec-6-slide-1-1.jpg);
            background-repeat: no-repeat;
            background-size: 150%;
            background-position: center;

            position: relative;

            filter: blur(10px);

            z-index: -2;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(1)>.sec-6-content-swiperBox>.background>div.bg-0 {
            background-image: url(../imgs/img-sec-6-slide-1-1.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(1)>.sec-6-content-swiperBox>.background>div.bg-1 {
            background-image: url(../imgs/img-sec-6-slide-1-2.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(1)>.sec-6-content-swiperBox>.background>div.bg-2 {
            background-image: url(../imgs/img-sec-6-slide-1-3.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(2)>.sec-6-content-swiperBox>.background>div.bg-0 {
            background-image: url(../imgs/img-sec-6-slide-2-1.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(2)>.sec-6-content-swiperBox>.background>div.bg-1 {
            background-image: url(../imgs/img-sec-6-slide-2-2.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(2)>.sec-6-content-swiperBox>.background>div.bg-2 {
            background-image: url(../imgs/img-sec-6-slide-2-3.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(3)>.sec-6-content-swiperBox>.background>div.bg-0 {
            background-image: url(../imgs/img-sec-6-slide-3-1.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(3)>.sec-6-content-swiperBox>.background>div.bg-1 {
            background-image: url(../imgs/img-sec-6-slide-3-2.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide:nth-child(3)>.sec-6-content-swiperBox>.background>div.bg-2 {
            background-image: url(../imgs/img-sec-6-slide-3-3.jpg);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.background>div.blur {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;

            background-color: #fff;
            opacity: 0.5;

            z-index: -1;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.sec-6-content-swiper {
            width: 100%;
            max-width: 560px;

            aspect-ratio: 560 / 710;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.sec-6-content-swiper .swiper-slide {
            width: 100%;
            height: 95%;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.sec-6-content-swiper .swiper-slide>div {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.sec-6-content-swiper img {
            height: 100%;
            object-fit: cover;
            transform: scale(1.1);
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.sec-6-content-swiper>.slide-pagination {
            bottom: var(--swiper-pagination-bottom, 0);
            position: absolute;
            z-index: 2;
            text-align: center;
        }

        .sec-6-project .sec-6-swiper>.swiper-wrapper>.swiper-slide>.sec-6-content-swiperBox>.sec-6-content-swiper>.slide-pagination>.swiper-pagination-bullet {
            width: 8px;
            height: 8px;
            background-color: #000;

        }
    </style>

    <script>
        var sec6swiper = new Swiper(".sec-6-swiper", {
            speed: 800,
            allowTouchMove: false,
            navigation: {
                nextEl: ".btn-next",
                prevEl: ".btn-prev",
            },
        });

        var sec6ContentSwiper1 = new Swiper(".sec-6-content-swiper-1", {
            speed: 800,
            slidesPerView: 1,
            spaceBetween: 40,
            pagination: {
                el: ".slide-pagination",
            },
            on: {
                slideChangeTransitionEnd() {
                    var $index = $('.sec-6-content-swiper .swiper-slide-active').index();
                    var $this = $('.sec-6-content-swiperBox-1>.background>.bg');

                    $this.removeClass('bg-0 bg-1 bg-2').addClass("bg" + "-" + $index);
                }
            }
        });
        var sec6ContentSwiper2 = new Swiper(".sec-6-content-swiper-2", {
            speed: 800,
            slidesPerView: 1,
            spaceBetween: 40,
            pagination: {
                el: ".slide-pagination",
            },
            on: {
                slideChangeTransitionEnd() {
                    var $index = $('.sec-6-content-swiper .swiper-slide-active').index();
                    var $this = $('.sec-6-content-swiperBox-2>.background>.bg');

                    $this.removeClass('bg-0 bg-1 bg-2').addClass("bg" + "-" + $index);
                }
            }
        });
        var sec6ContentSwiper3 = new Swiper(".sec-6-content-swiper-3", {
            speed: 800,
            slidesPerView: 1,
            spaceBetween: 40,
            pagination: {
                el: ".slide-pagination",
            },
            on: {
                slideChangeTransitionEnd() {
                    var $index = $('.sec-6-content-swiper .swiper-slide-active').index();
                    var $this = $('.sec-6-content-swiperBox-3>.background>.bg');

                    $this.removeClass('bg-0 bg-1 bg-2').addClass("bg" + "-" + $index);
                }
            }
        });
    </script>
</body>

</html>
